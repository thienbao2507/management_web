services:
  - type: web
    name: management-web-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.19
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://management-web-beta.vercel.app
