name: Migrate production database

on:
  push:
    branches: [main]
    paths:
      - "backend/alembic/**"
      - "backend/app/models/**"
      - ".github/workflows/migrate.yml"
  workflow_dispatch:

concurrency:
  group: prod-db-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: backend
    env:
      # Direct (non-pooler) Neon URL. alembic/env.py refuses a -pooler host.
      DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Check secret
        run: |
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "::error::Missing repository secret DATABASE_URL_UNPOOLED"
            exit 1
          fi

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify single Alembic head
        run: |
          heads=$(python -B -m alembic heads | wc -l)
          if [ "$heads" -ne 1 ]; then
            echo "::error::Expected exactly one Alembic head, found $heads"
            exit 1
          fi

      - name: Current revision (before)
        run: python -B -m alembic current

      - name: Upgrade to head
        run: python -B -m alembic upgrade head

      - name: Current revision (after)
        run: python -B -m alembic current
